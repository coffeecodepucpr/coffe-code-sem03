<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar, Buscador de Grupos de Estudo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="pagina-central">
    <div class="cartao-login">
      <header>
        <h1>Entrar</h1>
        <p>Acesse sua conta para ver seus grupos de estudo.</p>
      </header>
      <main>
        <form class="form-login" id="form-login" novalidate>
          <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
            <span class="erro-campo" id="erro-email"></span>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
            <span class="erro-campo" id="erro-senha"></span>
          </div>
          <button type="submit" class="botao botao-primario">Entrar</button>
          <p class="mensagem-sucesso" id="mensagem-sucesso"></p>
        </form>
      </main>
      <p class="form-footer">Ainda não tem conta? Cadastre-se.</p>
    </div>
  </div>
</body>
</html>
