  </defs>
  <rect x="0" y="0" width="940" height="420" fill="#E6D6C1"/>

<text x="470.0" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#7A553A" text-anchor="middle" >OBJETO JAVASCRIPT × JSON</text>
<text x="250.0" y="76" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >OBJETO JAVASCRIPT (na memória)</text>
<rect x="60" y="90" width="380" height="220" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="84" y="130" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >const grupo = {</text>
<text x="84" y="160" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >  materia: "Cálculo I",</text>
<text x="84" y="190" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >  participantes: 5,</text>
<text x="84" y="220" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >};</text>
<text x="710.0" y="76" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >JSON (texto)</text>
<rect x="520" y="90" width="380" height="220" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="544" y="130" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >{</text>
<text x="544" y="160" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >  "materia": "Cálculo I",</text>
<text x="544" y="190" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >  "participantes": 5</text>
<text x="544" y="220" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#F3E9D7" text-anchor="start" >}</text>
<line x1="455" y1="186.0" x2="505" y2="186.0" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="505" y1="214.0" x2="455" y2="214.0" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="480.0" y="176.0" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#7A553A" text-anchor="middle" >JSON.stringify()</text>
<text x="480.0" y="238.0" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#7A553A" text-anchor="middle" >JSON.parse()</text>
<text x="470.0" y="360" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >JSON é sempre texto, por isso pode viajar por uma rede ou virar um arquivo</text>
